<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub User Finder</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section>
      <div
        class="container d-flex justify-content-center align-items-center flex-column pt-3"
        style="min-height: 100vh"
      >
        <div
          class="d-flex flex-column justify-content-center align-content-center gap-3 w-100"
        >
          <div class="d-flex justify-content-center align-items-center">
            <div
              class="bg-dark rounded-circle"
              style="width: 4.5rem; height: 4.5rem"
            ></div>
          </div>
          <div class="content">
            <h1 class="text-dark fw-bold text-center fs-1">
              GitHub User Finder
            </h1>
            <p class="text-center fs-6 text-secondary">
              Search for any GitHub user by their username
            </p>
          </div>

          <div class="d-flex justify-content-center align-items-center">
            <div
              class="py-3 px-5 bg-white rounded-4 d-flex flex-column shadow-lg gap-3"
              style="width: 60%"
            >
              <div class="d-flex">
                <input
                  type="text"
                  class="form-control rounded-0 py-3 shadow-none"
                  placeholder="Enter Github username"
                />
                <button class="btn btn-primary rounded-0 px-3">Show</button>
              </div>
              <div
                class="divMessage rounded-2 d-flex justify-content-center align-items-center py-2 d-none"
              ></div>
            </div>
          </div>
        </div>
        <div class="user w-100"></div>
      </div>
    </section>

    <script src="index.js"></script>
  </body>
</html>
